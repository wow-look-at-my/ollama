name: docker-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to buildhost
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-docker-login@claude/sharp-cerf-fc9Vz
      - name: Build Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          sbom: false
          tags: pazer.build/ollama:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify ollama binary
        run: docker run --rm pazer.build/ollama:${{ github.sha }} --version
      - name: Push image to buildhost
        run: |
          docker tag pazer.build/ollama:${{ github.sha }} pazer.build/ollama:latest
          docker push pazer.build/ollama:${{ github.sha }}
          docker push pazer.build/ollama:latest
