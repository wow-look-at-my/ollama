name: docker-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

permissions:
  id-token: write
  contents: read
  actions: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push layers to ghcr as they build, and also load the image into the
          # local daemon so the verify/extract steps below can use it.
          push: true
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify ollama binary
        run: docker run --rm ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }} --version
      - name: Extract binary
        run: |
          docker create --name extract ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          mkdir -p dist
          docker cp extract:/usr/bin/ollama dist/ollama_linux_amd64
          docker rm extract
      - uses: actions/upload-artifact@v4
        with:
          name: go-build
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master

  bench:
    # needs: build so we can read needs.build.outputs.image_tag for the container field
    needs: [build, publish]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      OLLAMA_MODELS: /tmp/ollama-models
    container:
      image: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq git-lfs jq hyperfine

      # ── Model cache ─────────────────────────────────────────────────────────
      - name: Cache Qwen2.5-0.5B safetensors
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /tmp/hf-model
          key: qwen2.5-0.5b-safetensors-v1

      - name: Download Qwen2.5-0.5B
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 https://huggingface.co/Qwen/Qwen2.5-0.5B /tmp/hf-model

      # ── Ollama server (runs in the same container as the steps) ─────────────
      - name: Start ollama server
        run: |
          mkdir -p /tmp/ollama-models
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/health >/dev/null 2>&1 \
              && { echo "Ready after ${i}s"; exit 0; }
            sleep 1
          done
          echo "Timed out waiting for ollama" >&2; exit 1

      # ── Benchmarks ──────────────────────────────────────────────────────────
      - name: Benchmark quantizations
        run: |
          printf 'FROM /tmp/hf-model\n'    > /tmp/mf-f16
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q8-0
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q5-k-m
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q5-k-s
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q4-k-m
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q4-k-s
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q4-0
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q3-k-m
          printf 'FROM /tmp/hf-model\n'   > /tmp/mf-q2-k

          hyperfine \
            --runs 1 \
            --warmup 0 \
            --ignore-failure \
            --export-json /tmp/bench.json \
            --command-name F16    "ollama create qwen25-f16    -f /tmp/mf-f16" \
            --command-name Q8_0   "ollama create qwen25-q8-0   -f /tmp/mf-q8-0   --quantize Q8_0" \
            --command-name Q5_K_M "ollama create qwen25-q5-k-m -f /tmp/mf-q5-k-m --quantize Q5_K_M" \
            --command-name Q5_K_S "ollama create qwen25-q5-k-s -f /tmp/mf-q5-k-s --quantize Q5_K_S" \
            --command-name Q4_K_M "ollama create qwen25-q4-k-m -f /tmp/mf-q4-k-m --quantize Q4_K_M" \
            --command-name Q4_K_S "ollama create qwen25-q4-k-s -f /tmp/mf-q4-k-s --quantize Q4_K_S" \
            --command-name Q4_0   "ollama create qwen25-q4-0   -f /tmp/mf-q4-0   --quantize Q4_0" \
            --command-name Q3_K_M "ollama create qwen25-q3-k-m -f /tmp/mf-q3-k-m --quantize Q3_K_M" \
            --command-name Q2_K   "ollama create qwen25-q2-k   -f /tmp/mf-q2-k   --quantize Q2_K"

      - name: Finalize summary
        if: always()
        run: |
          get_gguf_size() {
            local manifest="$OLLAMA_MODELS/manifests/registry.ollama.ai/library/$1/latest"
            [[ -f "$manifest" ]] || { echo "—"; return; }
            local b
            b=$(jq -r '[.layers[] | select(.mediaType | contains("model")) | .size] | add // 0' "$manifest" 2>/dev/null)
            [[ -z "$b" || "$b" == "null" || "$b" == "0" ]] && { echo "—"; return; }
            if   (( b >= 1073741824 )); then awk "BEGIN{printf \"%.2f GiB\", $b/1073741824}"
            elif (( b >= 1048576    )); then awk "BEGIN{printf \"%.2f MiB\", $b/1048576}"
            else echo "${b} B"; fi
          }

          IMAGE="ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}"
          {
            echo "# Quantization Benchmarks — Qwen/Qwen2.5-0.5B"
            echo ""
            echo "> **Model**: [Qwen/Qwen2.5-0.5B](https://huggingface.co/Qwen/Qwen2.5-0.5B) · safetensors input"
            echo ">"
            echo "> **Image**: \`$IMAGE\`"
            echo ">"
            echo "> **Runner**: ubuntu-latest (CPU-only, $(nproc) vCPUs) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Quant | From | Duration | GGUF Size | Status |"
            echo "|:------|:-----|:--------:|----------:|:------:|"
            if [[ -f /tmp/bench.json ]]; then
              jq -c '.results[]' /tmp/bench.json | while read -r r; do
                name=$(echo "$r" | jq -r '.command')
                rc=$(echo "$r"   | jq -r '.exit_codes[0]')
                dur_s=$(echo "$r" | jq -r '.mean')
                dur=$(awk "BEGIN{s=int($dur_s); if(s>=60) printf \"%dm %ds\",int(s/60),s%60; else printf \"%ds\",s}")
                model="qwen25-$(echo "$name" | tr '[:upper:]_' '[:lower:]-')"
                from="safetensors"
                if [[ "$rc" == "0" ]]; then size=$(get_gguf_size "$model"); status="✅"
                else size="—"; status="❌"; fi
                printf '| `%s` | %s | %s | %s | %s |\n' "$name" "$from" "$dur" "$size" "$status"
              done
            else
              echo "| — | — | — | — | ⏭ benchmark did not run |"
            fi
            echo ""
            echo "_Unsupported quant types show ❌ — expected until ParseFileType covers them._"
          } >> "$GITHUB_STEP_SUMMARY"
