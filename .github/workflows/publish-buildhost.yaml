name: Publish to Buildhost

on:
  push:

concurrency:
  group: publish-buildhost-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ollama:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Extract binary
        run: |
          mkdir -p dist
          docker create --name extract ollama:${{ github.sha }}
          docker cp extract:/usr/bin/ollama dist/ollama_linux_amd64
          docker rm extract
      - uses: actions/upload-artifact@v4
        with:
          name: go-build
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master
