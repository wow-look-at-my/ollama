name: docker-build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:

permissions:
  id-token: write
  contents: read
  actions: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          # Push layers to ghcr as they build, and also load the image into the
          # local daemon so the verify/extract steps below can use it.
          push: true
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Store/read the build layer cache in ghcr so subsequent runs reuse it.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
      - name: Verify ollama binary
        run: docker run --rm ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }} --version
      - name: Extract binary
        run: |
          docker create --name extract ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          mkdir -p dist
          docker cp extract:/usr/bin/ollama dist/ollama_linux_amd64
          docker rm extract
      - uses: actions/upload-artifact@v4
        with:
          name: go-build
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish@master

  bench:
    # needs: build so we can read needs.build.outputs.image_tag for the container field
    needs: [build, publish]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      OLLAMA_MODELS: /tmp/ollama-models
    container:
      image: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq python3-pip jq
          pip3 install --quiet --break-system-packages huggingface-hub

      # ── Model cache ─────────────────────────────────────────────────────────
      - name: Cache Qwen2.5-0.5B safetensors
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /tmp/hf-model
          key: qwen2.5-0.5b-safetensors-v1

      - name: Download Qwen2.5-0.5B
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          python3 - << 'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
            "Qwen/Qwen2.5-0.5B",
            local_dir="/tmp/hf-model",
            ignore_patterns=["*.bin", "*.pt", "flax_model*", "tf_model*", "rust_model*"],
          )
          PY

      # ── Ollama server (runs in the same container as the steps) ─────────────
      - name: Start ollama server
        run: |
          mkdir -p /tmp/ollama-models
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          # Wait for ready
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/health >/dev/null 2>&1 \
              && { echo "Ready after ${i}s"; exit 0; }
            sleep 1
          done
          echo "Timed out waiting for ollama" >&2; exit 1

      # ── Helper functions shared across bench steps ───────────────────────────
      # bench_quant writes each result row to /tmp/bench-rows/<QUANT>.txt so
      # the finalize step can assemble the complete table in a single write to
      # GITHUB_STEP_SUMMARY — GHA inserts a blank line between each step's
      # summary contribution, which would break a multi-step Markdown table.
      - name: Write bench helpers
        run: |
          mkdir -p /tmp/bench-rows
          cat > /tmp/bench-helpers.sh << 'EOF'
          fmt_dur() {
            if (( $1 >= 60 )); then echo "$(($1/60))m $(($1%60))s"; else echo "${1}s"; fi
          }

          get_gguf_size() {
            local manifest="$OLLAMA_MODELS/manifests/registry.ollama.ai/library/$1/latest"
            [[ -f "$manifest" ]] || { echo "—"; return; }
            local b
            b=$(jq -r '[.layers[] | select(.mediaType | contains("model")) | .size] | add // 0' "$manifest" 2>/dev/null)
            [[ -z "$b" || "$b" == "null" || "$b" == "0" ]] && { echo "—"; return; }
            if   (( b >= 1073741824 )); then awk "BEGIN{printf \"%.2f GiB\", $b/1073741824}"
            elif (( b >= 1048576    )); then awk "BEGIN{printf \"%.2f MiB\", $b/1048576}"
            else echo "${b} B"; fi
          }

          bench_quant() {
            local quant=$1 from_label=$2 modelfile_content=$3 quant_flag=${4:-}
            local model_name
            model_name="qwen25-$(printf '%s' "$quant" | tr '[:upper:]_' '[:lower:]-')"
            local modelfile="/tmp/Modelfile-${model_name}"
            printf '%s\n' "$modelfile_content" > "$modelfile"

            local t0 t1 rc=0
            t0=$(date +%s)
            # shellcheck disable=SC2086
            ollama create "$model_name" -f "$modelfile" $quant_flag \
              > "/tmp/log-${model_name}.txt" 2>&1 || rc=$?
            t1=$(date +%s)

            local dur size status
            dur=$(fmt_dur $((t1 - t0)))
            if [[ $rc -eq 0 ]]; then
              size=$(get_gguf_size "$model_name"); status="✅"
            else
              size="—"; status="❌"
              echo "--- $quant failed (rc=$rc) ---" >&2
              cat "/tmp/log-${model_name}.txt" >&2
            fi
            printf '| `%s` | %s | %s | %s | %s |\n' \
              "$quant" "$from_label" "$dur" "$size" "$status" > "/tmp/bench-rows/${quant}.txt"
          }
          EOF

      # ── Benchmarks ──────────────────────────────────────────────────────────
      - name: Quantize F16 (safetensors → GGUF)
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "F16" "safetensors" "FROM /tmp/hf-model"

      - name: Quantize Q8_0
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q8_0" "F16" "FROM qwen25-f16" "--quantize Q8_0"

      - name: Quantize Q5_K_M
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q5_K_M" "F16" "FROM qwen25-f16" "--quantize Q5_K_M"

      - name: Quantize Q5_K_S
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q5_K_S" "F16" "FROM qwen25-f16" "--quantize Q5_K_S"

      - name: Quantize Q4_K_M
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q4_K_M" "F16" "FROM qwen25-f16" "--quantize Q4_K_M"

      - name: Quantize Q4_K_S
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q4_K_S" "F16" "FROM qwen25-f16" "--quantize Q4_K_S"

      - name: Quantize Q4_0
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q4_0" "F16" "FROM qwen25-f16" "--quantize Q4_0"

      - name: Quantize Q3_K_M
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q3_K_M" "F16" "FROM qwen25-f16" "--quantize Q3_K_M"

      - name: Quantize Q2_K
        continue-on-error: true
        run: |
          source /tmp/bench-helpers.sh
          bench_quant "Q2_K" "F16" "FROM qwen25-f16" "--quantize Q2_K"

      - name: Finalize summary
        if: always()
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}"
          {
            echo "# Quantization Benchmarks — Qwen/Qwen2.5-0.5B"
            echo ""
            echo "> **Model**: [Qwen/Qwen2.5-0.5B](https://huggingface.co/Qwen/Qwen2.5-0.5B) · safetensors input"
            echo ">"
            echo "> **Image**: \`$IMAGE\`"
            echo ">"
            echo "> **Runner**: ubuntu-latest (CPU-only, $(nproc) vCPUs) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Quant | From | Duration | GGUF Size | Status |"
            echo "|:------|:-----|:--------:|----------:|:------:|"
            for quant in F16 Q8_0 Q5_K_M Q5_K_S Q4_K_M Q4_K_S Q4_0 Q3_K_M Q2_K; do
              f="/tmp/bench-rows/${quant}.txt"
              if [[ -f "$f" ]]; then cat "$f"
              else printf '| `%s` | — | — | — | ⏭ |\n' "$quant"
              fi
            done
            echo ""
            echo "_Unsupported quant types show ❌ — expected until ParseFileType covers them._"
          } >> "$GITHUB_STEP_SUMMARY"
