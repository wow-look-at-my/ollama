name: Quantization Benchmarks

# Runs automatically after docker-build completes (image already available).
# For feature branches (where workflow_run only fires once merged to main),
# trigger manually via workflow_dispatch.
on:
  workflow_run:
    workflows: [docker-build]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Ollama image tag to benchmark (e.g. "main", "latest")'
        default: latest
        required: false

permissions:
  contents: read
  packages: read

jobs:
  bench:
    # For workflow_run: only proceed when the triggering build succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: img
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Sanitize branch name to a Docker-safe tag (mirrors docker/metadata-action behaviour)
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            TAG=$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/-\{2,\}/-/g' | sed 's/^-//;s/-$//')
          else
            TAG="latest"
          fi
          IMAGE="ghcr.io/${{ github.repository }}:$TAG"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Benchmark image: $IMAGE"

      - name: Pull ollama image
        run: docker pull "${{ steps.img.outputs.image }}"

      # ── Model cache ──────────────────────────────────────────────────────────
      - name: Cache Qwen2.5-0.5B safetensors
        id: cache-model
        uses: actions/cache@v4
        with:
          path: /tmp/hf-model
          # Bump the suffix to force a fresh download if the model changes.
          key: qwen2.5-0.5b-safetensors-v1

      - name: Download Qwen2.5-0.5B
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          pip install --quiet huggingface-hub
          python3 - << 'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
            "Qwen/Qwen2.5-0.5B",
            local_dir="/tmp/hf-model",
            # Skip non-safetensors weight formats to keep the download small
            ignore_patterns=["*.bin", "*.pt", "flax_model*", "tf_model*", "rust_model*"],
          )
          PY

      # ── Ollama server in a container ─────────────────────────────────────────
      - name: Start ollama container
        run: |
          mkdir -p /tmp/ollama-models /tmp/bench-files
          docker run -d \
            --name ollama-bench \
            -v /tmp/hf-model:/tmp/hf-model:ro \
            -v /tmp/ollama-models:/root/.ollama/models \
            -v /tmp/bench-files:/tmp/bench-files \
            --entrypoint /usr/bin/ollama \
            "${{ steps.img.outputs.image }}" \
            serve

      - name: Wait for ollama ready
        run: |
          echo "Waiting for ollama server..."
          for i in $(seq 1 60); do
            if docker exec ollama-bench curl -sf http://localhost:11434/health >/dev/null 2>&1; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for ollama" >&2
          docker logs ollama-bench >&2
          exit 1

      # ── Benchmarks ───────────────────────────────────────────────────────────
      - name: Benchmark quantizations
        run: |
          BENCH_DIR=/tmp/bench-files
          OLLAMA_MODELS=/tmp/ollama-models

          # ── helpers ──────────────────────────────────────────────────────────

          fmt_dur() {
            local s=$1
            (( s >= 60 )) && echo "$((s / 60))m $((s % 60))s" || echo "${s}s"
          }

          # Read the GGUF layer size from a model's manifest (host-side).
          get_gguf_size() {
            local model=$1
            local manifest="$OLLAMA_MODELS/manifests/library/$model/latest"
            [[ -f "$manifest" ]] || { echo "—"; return; }
            local bytes
            bytes=$(jq -r '[.layers[] | select(.mediaType | contains("model")) | .size] | add // 0' "$manifest" 2>/dev/null)
            if [[ -z "$bytes" || "$bytes" == "null" || "$bytes" == "0" ]]; then
              echo "—"
              return
            fi
            if   (( bytes >= 1073741824 )); then awk "BEGIN{printf \"%.2f GiB\", $bytes/1073741824}"
            elif (( bytes >= 1048576    )); then awk "BEGIN{printf \"%.2f MiB\", $bytes/1048576}"
            else echo "${bytes} B"
            fi
          }

          # Run one ollama create and append a result row to the summary.
          # Args: quant  from_label  modelfile_content  [quant_flag]
          create_and_bench() {
            local quant=$1
            local from_label=$2
            local modelfile_content=$3
            local quant_flag=${4:-}

            # Docker-safe model name: lowercase, underscores → dashes
            local model_name
            model_name="qwen25-$(printf '%s' "$quant" | tr '[:upper:]_' '[:lower:]-')"

            local modelfile="$BENCH_DIR/Modelfile-${model_name}"
            printf '%s\n' "$modelfile_content" > "$modelfile"

            local log_file="$BENCH_DIR/log-${model_name}.txt"
            local t0 t1 rc=0
            t0=$(date +%s)
            # shellcheck disable=SC2086  # $quant_flag intentionally unquoted (may be empty)
            docker exec ollama-bench ollama create "$model_name" -f "$modelfile" $quant_flag \
              > "$log_file" 2>&1 || rc=$?
            t1=$(date +%s)

            local dur size status
            dur=$(fmt_dur $((t1 - t0)))

            if [[ $rc -eq 0 ]]; then
              size=$(get_gguf_size "$model_name")
              status="✅"
            else
              size="—"
              status="❌"
              # Surface the failure reason in the step log (not the summary)
              echo "--- $quant failed (rc=$rc) ---" >&2
              cat "$log_file" >&2
            fi

            printf '| `%s` | %s | %s | %s | %s |\n' \
              "$quant" "$from_label" "$dur" "$size" "$status" \
              >> "$GITHUB_STEP_SUMMARY"
          }

          # ── Summary header ───────────────────────────────────────────────────
          {
            echo "# Quantization Benchmarks — Qwen/Qwen2.5-0.5B"
            echo ""
            echo "> **Model**: [Qwen/Qwen2.5-0.5B](https://huggingface.co/Qwen/Qwen2.5-0.5B) · safetensors input"
            echo ">"
            echo "> **Image**: \`${{ steps.img.outputs.image }}\`"
            echo ">"
            echo "> **Runner**: ubuntu-latest (CPU-only, $(nproc) vCPUs) · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Quant | From | Duration | GGUF Size | Status |"
            echo "|:------|:-----|:--------:|----------:|:------:|"
          } >> "$GITHUB_STEP_SUMMARY"

          # ── Step 1: safetensors → F16 (full conversion, no requantisation) ──
          create_and_bench "F16" "safetensors" "FROM /tmp/hf-model"

          # ── Step 2: requantise from the F16 model ────────────────────────────
          # Types not yet supported by ParseFileType will be caught, logged, and
          # shown as ❌ in the summary — they do not fail the workflow.
          F16_FROM="FROM qwen25-f16"
          for QUANT in Q8_0 Q5_K_M Q5_K_S Q4_K_M Q4_K_S Q4_0 Q3_K_M Q2_K; do
            create_and_bench "$QUANT" "F16" "$F16_FROM" "--quantize $QUANT"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Unsupported quant types appear as ❌ — this is expected while support is being added._" \
            >> "$GITHUB_STEP_SUMMARY"

      # ── Cleanup ───────────────────────────────────────────────────────────────
      - name: Cleanup
        if: always()
        run: docker rm -f ollama-bench 2>/dev/null || true
